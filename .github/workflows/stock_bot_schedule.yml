name: Stock Bot Scheduler

on:
  schedule:
    # Run every 6 hours in PKT (UTC+5)
    # PKT times: 00:00, 06:00, 12:00, 18:00
    # UTC times: 19:00, 01:00, 07:00, 13:00 (previous day, same day, same day, same day)
    - cron: '0 1,7,13,19 * * *'
  
  # Allow manual triggering
  workflow_dispatch:

jobs:
  run-stock-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create logs directory
      run: mkdir -p logs
    
    - name: Run Stock Bot
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
        FACEBOOK_APP_SECRET: ${{ secrets.FACEBOOK_APP_SECRET }}
        FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
        FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        LOG_LEVEL: INFO
        POST_WITH_IMAGE: true
      run: |
        python src/stock_bot.py
    
    - name: Upload logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: stock-bot-logs
        path: logs/
        retention-days: 7
    
    - name: Notify on failure
      if: failure()
      run: |
        echo "Stock Bot run failed! Check the logs for details."
        # You can add notification logic here (email, Slack, etc.)
